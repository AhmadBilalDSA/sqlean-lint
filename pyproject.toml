[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlean-lint"
version = "0.2.0"
description = "Enterprise-grade, zero-telemetry Semantic SQL Performance Linter, AST Auto-Optimizer and Cloud Cost Gating Engine (100% local)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SQLean Engineering" }]
keywords = ["sql", "linter", "sqlglot", "duckdb", "performance", "cost", "optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Database",
]
dependencies = [
    "sqlglot>=25.0.0",
    "duckdb>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
sqlean-lint = "sqlean_lint.cli:app"
sqlean-lint-mcp = "sqlean_lint.mcp_server:main"

[tool.setuptools.packages.find]
include = ["sqlean_lint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
